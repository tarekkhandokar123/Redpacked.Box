<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Red Packet Mini App</title>

    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
<script src="https://w.tads.me/widget.js"></script>
<script src="//libtl.com/sdk.js" data-zone="9669121" data-sdk="show_9669121"></script>
<script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-wrapper"></div>

    <!-- Professional Animated Splash Screen -->
    <div id="splash-screen" class="splash-backdrop">
        <div class="splash-content">
            <div class="splash-glow"></div>
            <div class="gift-box-anim pulse-glow">
                <svg width="84" height="84" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 12V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V12" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
                    <path d="M22 7C22 7.55228 21.5523 8 21 8H3C2.44772 8 2 7.55228 2 7V5C2 4.44772 2.44772 4 3 4H21C21.5523 4 22 4.44772 22 5V7Z" fill="url(#splash_grad)" stroke="#FFB300" stroke-width="1.5"/>
                    <path d="M12 22V8" stroke="#FFD700" stroke-width="2" stroke-dasharray="2 2"/>
                    <path d="M12 8C12 8 9.5 3 6.5 3C4.5 3 3.5 4.5 4.5 6C5.5 7.5 12 8 12 8Z" stroke="#FF4D4D" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="M12 8C12 8 14.5 3 17.5 3C19.5 3 20.5 4.5 19.5 6C18.5 7.5 12 8 12 8Z" stroke="#FF4D4D" stroke-width="1.8" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="splash_grad" x1="2" y1="4" x2="22" y2="8" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#E53935"/>
                            <stop offset="1" stop-color="#D32F2F"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="loading-spinner-ring"></div>
            <div class="loading-text">Unwrapping Rewards...</div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="main-layout" style="display: none;">
        
        <!-- Header Section -->
        <header class="app-header">
            <div class="user-profile" id="user-profile">
                <div class="avatar-wrapper">
                    <img id="user-avatar" src="default-avatar.png" alt="User">
                    <span class="online-indicator"></span>
                </div>
                <div class="user-meta">
                    <span id="user-name" class="user-display-name">User</span>
                    <span class="user-badge" id="user-role-badge">Member</span>
                </div>
            </div>

            <button class="publish-btn action-ripple" onclick="UI_Controller.openAdminApp()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <div class="btn-text-group">
                    <span class="btn-main-text">Publish Packet</span>
                    <small class="btn-sub-text">Partner Panel</small>
                </div>
            </button>
        </header>

        <!-- Dynamic Main Content Section -->
        <main id="main-content" class="content-body">
            
            <!-- View: Single Red Packet -->
            <section id="view-single" class="view-card glass-panel" style="display: none;">
                
                <div class="badges-row">
                    <!-- Channel Badge -->
                    <div class="meta-badge channel-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="rp-channel-name">Loading...</span>
                    </div>

                    <!-- Token Info Badge -->
                    <div class="meta-badge token-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 6v12M15 9.5C15 8.1 13.7 7 12 7s-3 1.1-3 2.5 1.3 2.5 3 2.5 3 1.1 3 2.5-1.3 2.5-3 2.5-3-1.1-3-2.5"></path>
                        </svg>
                        <span id="rp-token-info">Loading...</span>
                    </div>
                </div>

                <!-- Interactive Gift Box Core UI -->
                <div class="red-packet-container">
                    <div class="ambient-glow"></div>
                    
                    <div class="gift-box interactive-bounce" id="gift-box-btn">
                        <div class="sparkles-bg"></div>
                        <svg width="110" height="110" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="svg-gift">
                            <path d="M20 12V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V12" stroke="#FFD700" stroke-width="1.8"/>
                            <rect x="2" y="4" width="20" height="4" rx="1" fill="url(#gift_body)" stroke="#FFB300" stroke-width="1.2"/>
                            <path d="M12 22V8" stroke="#FFD700" stroke-width="1.8" stroke-dasharray="2 1"/>
                            <path d="M12 4C12 4 9.5 0 6.5 0C4.5 0 3.5 1.5 4.5 3C5.5 4.5 12 4 12 4Z" fill="#E53935"/>
                            <path d="M12 4C12 4 14.5 0 17.5 0C19.5 0 20.5 1.5 19.5 3C18.5 4.5 12 4 12 4Z" fill="#E53935"/>
                            <defs>
                                <linearGradient id="gift_body" x1="2" y1="4" x2="22" y2="8" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#E53935"/>
                                    <stop offset="1" stop-color="#B71C1C"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <button class="open-btn primary-glow-btn" id="open-btn">
                        <span>OPEN RED PACKET</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                    
                    <div class="limit-counter-card">
                        <div class="counter-header">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span>Claim Progress</span>
                        </div>
                        <div class="counter-progress-bar">
                            <div class="progress-fill" id="rp-progress-fill" style="width: 0%;"></div>
                        </div>
                        <div class="counter-numbers">
                            Opened: <strong><span id="rp-opened">0</span></strong> / <span id="rp-total">0</span>
                        </div>
                    </div>
                </div>

                <!-- Share Button -->
                <button class="share-btn secondary-btn" id="share-btn" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    <span>Share to Friends</span>
                </button>
            </section>

            <!-- View: Packet List -->
            <section id="view-list" class="view-card glass-panel" style="display: none;">
                <div class="section-heading">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
                    </svg>
                    <h2>Active Red Packets</h2>
                </div>

                <div id="packet-list-container" class="packets-grid">
                    <!-- Dynamic packet items render here -->
                </div>
            </section>
        </main>

        <!-- Footer Section -->
        <footer class="app-footer">
            <div class="footer-card">
                <div class="footer-item">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2">
                        <path d="M5 3l14 9-14 9V3z"></path>
                    </svg>
                    <span><strong>Event:</strong> Super Drop Week!</span>
                </div>
                
                <div class="footer-item">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64B5F6" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span><strong>Support:</strong> <a href="https://t.me/Onlineadsofficial" target="_blank">@Onlineadsofficial</a></span>
                </div>

                <div class="footer-item sponsor-tag">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5252" stroke-width="2">
                        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path>
                        <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-4.05 11a22.35 22.35 0 0 1-4 2z"></path>
                    </svg>
                    <span><strong>Sponsored by:</strong> <a href="https://t.me/DevTixoLab" target="_blank" class="sponsor-link">DevTixoLab</a></span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Main JavaScript Module -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/ads-manager.js"></script>
</body>
</html>
