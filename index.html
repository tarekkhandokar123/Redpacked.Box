<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Red Packet Mini App</title>

    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Telegram SDKs & Ad Networks -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <script src="https://w.tads.me/widget.js"></script>
    <script src="//libtl.com/sdk.js" data-zone="11714437" data-sdk="show_11714437"></script>
    <script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-wrapper"></div>

    <!-- Professional Animated Splash Screen -->
    <div id="splash-screen" class="splash-backdrop">
        <div class="splash-content">
            <div class="splash-glow"></div>
            <div class="gift-box-anim">
                <!-- 3D Red Packet Box SVG -->
                <svg width="110" height="110" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="25" width="70" height="65" rx="12" fill="url(#splash_body)" stroke="#FFD700" stroke-width="2.5"/>
                    <path d="M15 25 C15 25, 50 52, 85 25" fill="url(#splash_flap)" stroke="#FFB300" stroke-width="2"/>
                    <circle cx="50" cy="50" r="14" fill="url(#splash_gold_coin)" stroke="#FFE57F" stroke-width="2"/>
                    <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#B71C1C" text-anchor="middle">¥</text>
                    <defs>
                        <linearGradient id="splash_body" x1="15" y1="25" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#E53935"/>
                            <stop offset="1" stop-color="#9A0007"/>
                        </linearGradient>
                        <linearGradient id="splash_flap" x1="15" y1="25" x2="85" y2="52" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FF5252"/>
                            <stop offset="1" stop-color="#C62828"/>
                        </linearGradient>
                        <linearGradient id="splash_gold_coin" x1="36" y1="36" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFF176"/>
                            <stop offset="1" stop-color="#FF8F00"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="loading-spinner-ring"></div>
            <div class="loading-text">Unwrapping Rewards...</div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container" class="main-layout" style="display: none;">
        
        <!-- Header Section -->
        <header class="app-header">
            <div class="user-profile" id="user-profile">
                <div class="avatar-wrapper">
                    <img id="user-avatar" src="default-avatar.png" alt="User">
                    <span class="online-indicator"></span>
                </div>
                <div class="user-meta">
                    <span id="user-name" class="user-display-name">User</span>
                    <span class="user-badge" id="user-role-badge">Member</span>
                </div>
            </div>

            <button class="publish-btn action-ripple" onclick="UI_Controller.openAdminApp()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <div class="btn-text-group">
                    <span class="btn-main-text">Publish Packet</span>
                    <small class="btn-sub-text">Partner Panel</small>
                </div>
            </button>
        </header>

        <!-- Dynamic Main Content Section -->
        <main id="main-content" class="content-body">
            
            <!-- View: Single Red Packet -->
            <section id="view-single" class="view-card glass-panel" style="display: none;">
                
                <div class="badges-row">
                    <!-- Channel Badge -->
                    <div class="meta-badge channel-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="rp-channel-name">Loading...</span>
                    </div>

                    <!-- Token Info Badge -->
                    <div class="meta-badge token-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 6v12M15 9.5C15 8.1 13.7 7 12 7s-3 1.1-3 2.5 1.3 2.5 3 2.5 3 1.1 3 2.5-1.3 2.5-3 2.5-3-1.1-3-2.5"></path>
                        </svg>
                        <span id="rp-token-info">Loading...</span>
                    </div>
                </div>

                <!-- Interactive Upgraded Red Packet Core UI -->
                <div class="red-packet-container">
                    <div class="ambient-glow"></div>
                    
                    <div class="gift-box interactive-bounce" id="gift-box-btn">
                        <!-- Upgraded Premium Red Packet Box SVG without gaps -->
                        <svg width="125" height="125" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="svg-gift">
                            <rect x="15" y="22" width="70" height="68" rx="14" fill="url(#gift_body)" stroke="#FFD700" stroke-width="2.5"/>
                            <path d="M15 22 C15 22, 50 50, 85 22" fill="url(#gift_flap)" stroke="#FFB300" stroke-width="2"/>
                            <circle cx="50" cy="48" r="15" fill="url(#gold_coin_grad)" stroke="#FFE57F" stroke-width="2.5"/>
                            <text x="50" y="53.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="900" fill="#B71C1C" text-anchor="middle">¥</text>
                            <defs>
                                <linearGradient id="gift_body" x1="15" y1="22" x2="85" y2="90" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#E53935"/>
                                    <stop offset="1" stop-color="#8E0000"/>
                                </linearGradient>
                                <linearGradient id="gift_flap" x1="15" y1="22" x2="85" y2="50" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#FF5252"/>
                                    <stop offset="1" stop-color="#C62828"/>
                                </linearGradient>
                                <linearGradient id="gold_coin_grad" x1="35" y1="33" x2="65" y2="63" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#FFF176"/>
                                    <stop offset="1" stop-color="#FF8F00"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <button class="open-btn primary-glow-btn" id="open-btn">
                        <span>OPEN RED PACKET</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                    
                    <div class="limit-counter-card">
                        <div class="counter-header">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <span>Claim Progress</span>
                        </div>
                        <div class="counter-progress-bar">
                            <div class="progress-fill" id="rp-progress-fill" style="width: 0%;"></div>
                        </div>
                        <div class="counter-numbers">
                            Opened: <strong><span id="rp-opened">0</span></strong> / <span id="rp-total">0</span>
                        </div>
                    </div>
                </div>

                <!-- Share Button -->
                <button class="share-btn secondary-btn" id="share-btn" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                    <span>Share to Friends</span>
                </button>
            </section>

            <!-- View: Packet List -->
            <section id="view-list" class="view-card glass-panel" style="display: none;">
                <div class="section-heading">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
                    </svg>
                    <h2>Active Red Packets</h2>
                </div>

                <div id="packet-list-container" class="packets-grid">
                    <!-- Active dynamic packet items render here -->
                </div>
            </section>
        </main>

        <!-- Upgraded Modern Footer Section -->
        <footer class="app-footer">
            <div class="footer-card">
                <div class="footer-row">
                    <!-- Official Channel Link (Bangla Label as requested) -->
                    <a href="https://t.me/BTCREDPACKETBOX" target="_blank" class="footer-pill-btn official-channel-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-16.5 7.5a2.25 2.25 0 0 0 .126 4.137l4.015 1.338 1.54 4.885a1.5 1.5 0 0 0 2.65.418l2.67-3.23 4.316 3.18a2.25 2.25 0 0 0 3.54-1.48l3.1-15.5a2.25 2.25 0 0 0-2.435-2.663z"></path>
                        </svg>
                        <span>অফিসিয়াল চ্যানেল</span>
                    </a>
                </div>

                <div class="footer-sub-bar">
                    <span>Support: <a href="https://t.me/Onlineadsofficial" target="_blank">@Onlineadsofficial</a></span>
                    <span>Sponsored by: <a href="https://t.me/DevTixoLab" target="_blank" class="sponsor-tag-link">DevTixoLab</a></span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Main JavaScript Modules -->
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/ads-manager.js"></script>
</body>
    </html>
